<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributor Registration</title>
</head>

<body>
    <header>
        <h1>Registering as Food Distributor: </h1>
    </header>
    <main>
        <form>
            <div>
                <div>
                    <h3>Distributor Type:-</h3>
                    <label for="NGO">NGO</label>
                    <input type="radio" id="NGO" name="Distributor_identity" value="NGO">

                    <label for="Social Working Group">Social Working Group</label>
                    <input type="radio" id="Social Working Group" name="Distributor_identity"
                        value="Social Working Group">
                </div>
            </div>

            <div>
                <label for="Organization Name">Organization Name:</label>
                <input type="text" id="Organization Name" name="Organization Name" placeholder="eg. Koni Seva Sangh">
            </div>

            <div>
                <h3>Contact Details:-</h3>
                <div>
                    <label for="Address">Address:</label>
                    <input type="text" id="Address" name="Address">
                </div>
                <div>
                    <label for="Phone Number">Phone Number:</label>
                    <input type="number" id="Phone Number" name="Phone Number">
                </div>
                <div>
                    <label for="Email">Email:</label>
                    <input type="text" id="Email" name="Email">
                </div>
            </div>

            <div>
                <h3>Create Password:-</h3>
                <div>
                    <label for="Password">Password:</label>
                    <input type="text" id="Password" name="Password">
                </div>
                <div>
                    <label for="Confirm Password">Confirm Password</label>
                    <input type="password" id="Confirm Password" name="Confirm Password">
                </div>
            </div>

        </form>
        
        <div>
                <a href="2login.html" target="_blank"><button>Submit</button></a>
        </div>
    </main>
</body>

</html>
